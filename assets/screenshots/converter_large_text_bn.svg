  <circle cx="40" cy="390" r="5" fill="#28A745"/>
  <text x="54" y="395" font-family="sans-serif, 'SolaimanLipi'" font-size="12" fill="#1A241E">প্রস্তুত (সঠিক ম্যাপিং নিশ্চিত)</text>

  <!-- Bottom Buttons -->
  <g transform="translate(24, 422)">
