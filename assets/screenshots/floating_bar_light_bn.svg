<svg xmlns="http://www.w3.org/2000/svg" width="560" height="54" viewBox="0 0 560 54">
  <defs>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="560" height="54" rx="12" fill="#F7F8F6" stroke="#D1DCD5" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Authentic Bornomala Logo Emblem -->
  <g transform="translate(14, 11)">
    <rect width="32" height="32" rx="16" fill="#006A4E"/>
    <image href="data:image/png;base64," x="3" y="3" width="26" height="26" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- Title & Status -->
  <text x="56" y="25" font-family="sans-serif, 'SolaimanLipi'" font-size="13" font-weight="bold" fill="#1A241E">Bornomala</text>
  <circle cx="58" cy="37" r="4" fill="#28A745"/>
  <text x="68" y="41" font-family="sans-serif, 'SolaimanLipi'" font-size="10" fill="#5A6B60">সক্রিয়</text>

  <!-- Scheme Buttons -->
  <g transform="translate(160, 11)">
    <!-- Unicode -->
    <rect x="0" y="0" width="70" height="32" rx="6" fill="#006A4E" stroke="#D1DCD5" stroke-width="1"/>
    <text x="35" y="21" font-family="sans-serif, 'SolaimanLipi'" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ইউনিকোড</text>
    
    <!-- ANSI -->
    <rect x="76" y="0" width="70" height="32" rx="6" fill="#FFFFFF" stroke="#D1DCD5" stroke-width="1"/>
    <text x="111" y="21" font-family="sans-serif, 'SolaimanLipi'" font-size="12" font-weight="bold" fill="#1A241E" text-anchor="middle">ANSI</text>

    <!-- Phonetic -->
    <rect x="152" y="0" width="70" height="32" rx="6" fill="#FFFFFF" stroke="#D1DCD5" stroke-width="1"/>
    <text x="187" y="21" font-family="sans-serif, 'SolaimanLipi'" font-size="12" font-weight="bold" fill="#1A241E" text-anchor="middle">ফোনেটিক</text>

    <!-- English -->
    <rect x="228" y="0" width="60" height="32" rx="6" fill="#FFFFFF" stroke="#D1DCD5" stroke-width="1"/>
    <text x="258" y="21" font-family="sans-serif, 'SolaimanLipi'" font-size="12" font-weight="bold" fill="#1A241E" text-anchor="middle">EN</text>
  </g>

  <!-- Tools Quick Buttons -->
  <g transform="translate(460, 11)">
    <rect x="0" y="0" width="28" height="32" rx="6" fill="#FFFFFF" stroke="#D1DCD5" stroke-width="1"/>
    <text x="14" y="21" font-family="sans-serif" font-size="13" fill="#1A241E" text-anchor="middle">⌨</text>

    <rect x="32" y="0" width="28" height="32" rx="6" fill="#FFFFFF" stroke="#D1DCD5" stroke-width="1"/>
    <text x="46" y="21" font-family="sans-serif" font-size="13" fill="#1A241E" text-anchor="middle">⇄</text>

    <rect x="64" y="0" width="28" height="32" rx="6" fill="#FFFFFF" stroke="#D1DCD5" stroke-width="1"/>
    <text x="78" y="21" font-family="sans-serif" font-size="13" fill="#1A241E" text-anchor="middle">⚙</text>
  </g>
</svg>